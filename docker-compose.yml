services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: ady201m_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "nnt"
      MINIO_ROOT_PASSWORD: "020505"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: ady201m_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "nnt"
      POSTGRES_PASSWORD: "nnt123"
      POSTGRES_DB: "youtube_trending_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Dịch vụ 3: Giao diện Web quản lý PostgreSQL ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: ady201m_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "nnt@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "nnt020505"
    depends_on:
      - postgres

volumes:
  minio_data:
  postgres_data: